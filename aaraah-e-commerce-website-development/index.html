<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AARAAH — Premium Indian Ethnic Wear</title>
    <meta
      name="description"
      content="Shop premium sarees, kurtis, kurta sets, lehengas, dupattas and more at AARAAH. Elegant, modern Indian ethnic wear with free shipping across India."
    />
    <meta name="theme-color" content="#7a1730" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Cinzel:wght@500&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Cinzel:wght@500&display=swap"
      />
    </noscript>
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta property="og:site_name" content="AARAAH" />
    <meta property="og:url" content="https://aaraah.in/" />
    <meta property="og:image" content="https://aaraah.in/icon-512.png" />
    <meta name="twitter:image" content="https://aaraah.in/icon-512.png" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="AARAAH — Premium Indian Ethnic Wear" />
    <meta
      property="og:description"
      content="Shop premium sarees, kurtis, kurta sets, lehengas, dupattas and more at AARAAH. Elegant, modern Indian ethnic wear with free shipping across India."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Home and category pages need the product list: start downloading it right now, while the app code is
      // still loading, instead of after it (the app picks this request up; see src/services/products.ts).
      (function (l) {
        if (l.pathname === "/" || /^\/category\/[^/]+\/?$/.test(l.pathname)) {
          try {
            window.__aaraahFeed = fetch("/data/products-feed", { headers: { Accept: "application/json" } });
          } catch (e) {}
        }
      })(window.location);
    </script>
    <script>
      // GitHub Pages SPA fallback: restores the real route that 404.html
      // encoded into the query string before redirecting to index.html.
      (function (l) {
        if (l.search[1] === "/") {
          var decoded = l.search
            .slice(1)
            .split("&")
            .map(function (s) {
              return s.replace(/~and~/g, "&");
            })
            .join("?");
          window.history.replaceState(null, "", l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
